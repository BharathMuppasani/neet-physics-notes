name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check chapter coverage and saved progress
        run: node tests/check-site.cjs
      - name: Check physics answers and source references
        run: node tests/check-physics.cjs
      - name: Check expanded lesson content and experiment physics
        run: |
          python3 scripts/check_deep.py
          node tests/check-labs.cjs
      - name: Build standalone website
        run: python3 site/build.py --web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
